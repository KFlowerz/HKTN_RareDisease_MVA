seed: 42

# Overridden by $MVA_DATA_ROOT, which resolves to $MVA_DATA_ROOT/raw (custody location
# C1, docs/data_custody.md). This committed fallback stays machine-independent on
# purpose: the real path is outside the repo and differs per machine, so hardcoding an
# absolute home directory here would break a judge rebuilding from the repo alone.
data_dir: ./data
results_dir: ./results

# Cached public reference files (STRING, Reactome, ClinVar). NOT patient data and not in
# custody: whole public releases, downloaded once and matched against locally. Overridden
# by $MVA_REF_ROOT. A relative path resolves against the user's home directory, never the
# repo -- the ClinVar release is a .vcf.gz, and no genomic file may sit in the working
# tree (tests/test_smoke.py). src/refcache.py refuses a path inside the repository.
reference_dir: ~/.cache/mva-track2/reference

# Licence-RESTRICTED cached data, kept out of every redistributed output. Separate from
# reference_dir on purpose: the line between what may be republished and what may not is
# a directory boundary, not a convention. Overridden by $MVA_ENRICHMENT_ROOT.
# See src/l2_channels/enrichment.py and src/l4_validate/sources.md Table 5.
enrichment_dir: ~/.cache/mva-track2/enrichment

# Gate G1, decided 2026-09-17 (mngmt/decisions.md D9) from L0's candidate call and its
# ClinVar and gnomAD evidence. A research premise for the drug search, NOT a diagnosis:
# the pair is unphased, and D9's uncertainties travel with this value into every output.
# Change it only through a new recorded decision.
causal_gene: BUB1B

# L0 variant annotation runs LOCALLY -- no patient variant may leave the machine
# (COMPLIANCE.md), which rules out Ensembl's VEP REST API. The snpEff version is pinned in
# environment.yml. Every invocation must pass -noLog (snpEff otherwise reports usage
# statistics to its server), -nodownload (otherwise a missing database is fetched mid-run),
# and -noStats or -stats under results_dir (otherwise it writes summary files into the
# working directory -- here, the repo).
annotator:
  tool: snpeff
  database: GRCh38.115       # Ensembl 115; bare contig names (1..22, X, Y), matching the VCF
  java_heap: 8g              # passed as -Xmx; the bioconda wrapper's 1g default OOMs on this DB
  # Decision D5 (mngmt/decisions.md): MANE Select makes the LoF call; an all-transcript pass
  # keeps LoF found only on non-MANE transcripts as lof_tier=non_mane, never as a call.
  # snpEff -canon is refused (longest CDS, not MANE). No default -- src/l0_genomics/transcripts.py.
  transcript_policy: mane_select_tiered
  # MANE release the database's MANE_Select tags were cross-checked against for the SAC
  # panel (scripts/transcript_policy_check.py). Re-run that check on any database change.
  mane_release: MANE.GRCh38.v1.5

# L0 ClinVar cross-reference: what the public archive already says about the subject's
# panel alleles, as evidence for gate G1. The WHOLE release is downloaded and matched
# locally -- never a per-variant query, which would send this child's coordinates to NCBI
# (COMPLIANCE.md). It reports submitted interpretations and their review status; it
# classifies nothing. See src/l0_genomics/clinvar.py.
clinvar:
  enabled: true
  # PINNED to a dated weekly release. The rolling clinvar.vcf.gz is always reachable and
  # never reproducible -- NCBI replaces its contents weekly, so two runs a fortnight apart
  # would cross-reference this child's alleles against different archives and no output
  # would say so. This is the release docs/references.md records as `clinvar20260913`.
  url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar_20260913.vcf.gz
  # Same bytes, other location: NCBI moves a dated release into archive_2.0/ once the next
  # weekly lands, so naming only the primary would expire this pin on its own.
  fallback_urls:
    - https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/archive_2.0/2026/clinvar_20260913.vcf.gz

# L0 population frequency (decision D8). gnomAD is read by whole panel-gene span over
# HTTPS -- never by the subject's coordinates -- and only its CC0 count/frequency fields.
# It reports frequencies; it classifies nothing. See src/l0_genomics/gnomad.py.
gnomad:
  enabled: true
  release: "4.1.1"
  datasets: [exomes, genomes]

# L3 integration (decision D14). Identity is harmonised onto the parent ChEMBL molecule
# before anything is aggregated, then ranks are combined by Robust Rank Aggregation.
l3:
  # A channel ranking more than this fraction of the candidate pool cannot discriminate,
  # so its agreement alone is not reported as convergence. Channel B ranks essentially
  # every approved drug with a target in the interactome, which is why this exists.
  broad_channel_fraction: 0.5

  # The reasoning step needs a local model server running (docs/runtime.md). When it is
  # unreachable, L3 still writes a complete aggregation and records the gap in
  # integration.json's field_contract -- the ranking is valid without it, and a missing
  # rationale is a documented hole rather than a failed run.
  reasoning: true
  # Scope when L4 has not run yet. After L4 exists the step narrows to its survivors,
  # which is what the dossier needs.
  reasoning_top_n: 100
  reasoning_timeout_seconds: 300

# Gate G2, decided 2026-09-08 (mngmt/decisions.md D4).
# chemoprevention | symptomatic | mitotic_fidelity
#
# SECONDARY prevention (D4): recurrence and second-primary risk reduction, not
# prevention of a first cancer.
# The report must say so; "chemoprevention" alone overstates it.
therapeutic_endpoint: chemoprevention

# Model for the L3 reasoning step (decision D17). A LOCAL open-weights model, not a
# hosted one. Config-driven so the value the report names is the value that ran, and so
# it lands in results/_manifest.json rather than being buried in source.
model: qwen2.5-7b-instruct-q4_k_m

# Where that model is served. MUST be loopback: the step refuses any other host, because
# a local model behind a routable socket is a hosted API and reopens everything D17
# settled. Setup is in docs/runtime.md.
reasoning_endpoint: http://127.0.0.1:8080

# `signature` is OFF by decision D19, and the reason is a result rather than a gap: the
# channel is implemented and runs, but on a BUB1B-knockdown proxy its ranking is not
# distinguishable from an unrelated gene's knockdown at any candidate depth (p 0.15-0.41
# over 40 control genes), so it refuses to nominate. Reproduce with
# `python scripts/channel_c_diagnostics.py`. Turning it on makes L2 fail, which is the
# intended behaviour: the channel does not write a table it cannot defend.
channels: {kg: true, proximity: true, signature: false, phenotype: true, prior: true}

# L1 disease module. Both sources are licence-clean for a redistributed CC-BY-4.0 output:
# STRING is CC BY 4.0 (its attribution travels in module.json) and Reactome data is CC0.
# Every value here is written into results/l1_target/module.json beside the result, because
# a module boundary that is not recorded cannot be argued with.
l1:
  species: Homo sapiens
  taxon: 9606
  string_version: "12.0"
  string_score_min: 700    # STRING "high confidence" -- the graph the walk runs on
  seed_score_min: 900      # STRING "highest confidence", physical subnetwork -- complex proxy
  rwr_restart: 0.7         # higher keeps the module tighter around the seed set
  module_size: 200
  max_pathway_size: 200    # bigger pathways are too generic to define "upstream"
  # Second-disease (Scalability) run only. NEVER a way around gate G1: leave it null and
  # let causal_gene carry the finding a person signed off.
  gene: null
  # Which target set each endpoint makes primary for ranking. This mapping is a project
  # decision (gate G2, D4), not a property of the method, so it lives here and L1's code
  # stays disease-agnostic. An endpoint absent from this map leaves both sets in play.
  primary_set_by_endpoint:
    chemoprevention: downstream
    mitotic_fidelity: upstream
    symptomatic: both

# L2 channel settings. Channel B scores network proximity between a drug's targets and
# the L1 disease module, against a degree-matched null (Guney et al., 2016).
l2:
  channel_b:
    open_targets_release: "26.06"   # drug-target release; restricted, never redistributed
    approved_only: true              # scope is repurposing of APPROVED drugs
    permutations: 1000               # null resamples; fewer destabilises the tail
    min_bin_size: 100                # degree-bin floor, so a hub is never resampled as itself
  # Signature reversion on a PROXY (decision D19). There is no patient RNA, so the query
  # is the LINCS L1000 consensus knockdown of the causal gene, pooled across every cell
  # line that has one, and compounds are scored for reversing it. The proxy caveat is
  # written into every row, not into a footnote.
  channel_c:
    query_size: 100            # genes per tail of the query; CLUE's L1000 convention
    # The conventional "gold signature" floor is distil_cc_q75 >= 0.2. It is REPORTED,
    # not applied: enforcing it on this gene leaves too few cell lines for a pooled proxy
    # to mean anything, and cross-cell-line concordance is the quality measure that
    # applies to a pooled signature. Raise this to 0.2 to see the conventional filter.
    min_replicate_correlation: 0.0
    # Project the generic L1000 drug-response axis out of the query before scoring. NOT a
    # tuning knob: the proxy overlaps that axis at r = +0.52, and measured on this data
    # the uncorrected ranking does not beat random gene sets (p = 0.95) while the
    # corrected one does (p = 0.024). False exists to reproduce that comparison.
    deflate_generic_axis: true
    approved_only: true        # scope is repurposing of APPROVED drugs
    open_targets_release: "26.06"   # molecule identities; restricted, never redistributed
    top_n: 250                 # deepest nomination the null-calibrated ladder may reach
    # The null is OTHER GENES' knockdowns, not random gene sets. Two random-gene-set nulls
    # were tried and both passed everything: a structured biological query beats an
    # arbitrary one for reasons that have nothing to do with the gene. Only varying WHICH
    # gene isolates the question. See the channel's guardrail and D19.
    n_control_genes: 40        # min attainable p = 1/41
    p_max: 0.05                # the head must beat unrelated genes' knockdowns to nominate
    block_size: 2000           # signature rows read from the 5 GB matrix at a time
    max_scored_signatures: 200000
  # Phenotype channel (decision D10). The subject's terms are read from data_dir at run
  # time and never written here. Resources are downloaded whole and matched locally.
  channel_d:
    document_glob: "*Phenotype*.docx"
    hpo_url: http://purl.obolibrary.org/obo/hp/releases/2026-09-01/hp.obo
    monarch_url: https://data.monarchinitiative.org/monarch-kg/2026-09-02/tsv/disease_associations/disease_phenotype.all.tsv.gz
    open_targets_release: "26.06"   # indications; restricted, never redistributed (D7)
    approved_only: true                # the drug itself must be approved
    indication_stage: APPROVAL       # and approved FOR that indication; lower to widen
    permutations: 1000               # random queries per run; min attainable p = 1/1001
    p_max: 0.001                     # diseases no random query matched or beat
    top_diseases: 50                 # cap on diseases feeding the disease route
    min_term_ratio: 0.5              # phenotype route: IC(MICA)/IC(term) floor
  # Literature prior (decision D11). Ranks the curated compounds in
  # src/l2_channels/aneuploidy_prior.tsv by the literature Europe PMC returns for each.
  # No patient data reaches this channel: queries are built from the seed file and the
  # terms below, and src/l2_channels/literature.py refuses an outbound query carrying an
  # HPO id, a coordinate or an HGVS expression.
  channel_e:
    # Title and abstract, not full text: full text roughly triples recall and loses most of
    # the precision, and there is no extraction model here to sort the difference out.
    search_field: TITLE_ABS
    context_terms: ["aneuploid*", "chromosomal instability", "chromosome missegregation",
                    "trisomic", "trisomy", "whole-genome doubling"]
    max_records_per_compound: 200
    # A declared project choice, NOT a measured effect size -- the ranking moves if these
    # move, which is why they are here and recorded in channel.json rather than in code.
    grade_weights: {clinical: 4.0, in_vivo: 2.0, in_vitro: 1.0, ungraded: 0.25}
    require_direction: true          # drop records with no therapeutic-direction phrase
    # A record must name the compound and the aneuploid state in ONE sentence. Retrieval
    # only asks that both appear somewhere, which counts a myeloma paper naming the drug in
    # one paragraph and chromosomal instability in another.
    require_cooccurrence: true
    approved_only: true              # scope is repurposing of APPROVED drugs
    open_targets_release: "26.06"    # molecule identities; restricted, never redistributed
