seed: 42

# Overridden by $MVA_DATA_ROOT, which resolves to $MVA_DATA_ROOT/raw (custody location
# C1, docs/data_custody.md). This committed fallback stays machine-independent on
# purpose: the real path is outside the repo and differs per machine, so hardcoding an
# absolute home directory here would break a judge rebuilding from the repo alone.
data_dir: ./data
results_dir: ./results

# Cached public reference files (STRING, Reactome, ClinVar). NOT patient data and not in
# custody: whole public releases, downloaded once and matched against locally. Overridden
# by $MVA_REF_ROOT. A relative path resolves against the user's home directory, never the
# repo -- the ClinVar release is a .vcf.gz, and no genomic file may sit in the working
# tree (tests/test_smoke.py). src/refcache.py refuses a path inside the repository.
reference_dir: ~/.cache/mva-track2/reference

# Licence-RESTRICTED cached data, kept out of every redistributed output. Separate from
# reference_dir on purpose: the line between what may be republished and what may not is
# a directory boundary, not a convention. Overridden by $MVA_ENRICHMENT_ROOT.
# See src/l2_channels/enrichment.py and src/l4_validate/sources.md Table 5.
enrichment_dir: ~/.cache/mva-track2/enrichment

# Gate G1, decided 2026-09-17 (mngmt/decisions.md D9) from L0's candidate call and its
# ClinVar and gnomAD evidence. A research premise for the drug search, NOT a diagnosis:
# the pair is unphased, and D9's uncertainties travel with this value into every output.
# Change it only through a new recorded decision.
causal_gene: BUB1B

# L0 variant annotation runs LOCALLY -- no patient variant may leave the machine
# (COMPLIANCE.md), which rules out Ensembl's VEP REST API. The snpEff version is pinned in
# environment.yml. Every invocation must pass -noLog (snpEff otherwise reports usage
# statistics to its server), -nodownload (otherwise a missing database is fetched mid-run),
# and -noStats or -stats under results_dir (otherwise it writes summary files into the
# working directory -- here, the repo).
annotator:
  tool: snpeff
  database: GRCh38.115       # Ensembl 115; bare contig names (1..22, X, Y), matching the VCF
  java_heap: 8g              # passed as -Xmx; the bioconda wrapper's 1g default OOMs on this DB
  # Decision D5 (mngmt/decisions.md): MANE Select makes the LoF call; an all-transcript pass
  # keeps LoF found only on non-MANE transcripts as lof_tier=non_mane, never as a call.
  # snpEff -canon is refused (longest CDS, not MANE). No default -- src/l0_genomics/transcripts.py.
  transcript_policy: mane_select_tiered
  # MANE release the database's MANE_Select tags were cross-checked against for the SAC
  # panel (scripts/transcript_policy_check.py). Re-run that check on any database change.
  mane_release: MANE.GRCh38.v1.5

# L0 ClinVar cross-reference: what the public archive already says about the subject's
# panel alleles, as evidence for gate G1. The WHOLE release is downloaded and matched
# locally -- never a per-variant query, which would send this child's coordinates to NCBI
# (COMPLIANCE.md). It reports submitted interpretations and their review status; it
# classifies nothing. See src/l0_genomics/clinvar.py.
clinvar:
  enabled: true
  url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz

# L0 population frequency (decision D8). gnomAD is read by whole panel-gene span over
# HTTPS -- never by the subject's coordinates -- and only its CC0 count/frequency fields.
# It reports frequencies; it classifies nothing. See src/l0_genomics/gnomad.py.
gnomad:
  enabled: true
  release: "4.1.1"
  datasets: [exomes, genomes]

# Gate G2, decided 2026-09-08 (mngmt/decisions.md D4).
# chemoprevention | symptomatic | mitotic_fidelity
#
# SECONDARY prevention (D4): recurrence and second-primary risk reduction, not
# prevention of a first cancer.
# The report must say so; "chemoprevention" alone overstates it.
therapeutic_endpoint: chemoprevention

# Model for the L3 Claude-in-the-loop reasoning step. Config-driven so the value the
# report names is the value that ran, and so it lands in results/_manifest.json rather
# than being buried in source. Ids are complete as written -- never append a date suffix.
model: claude-opus-5

channels: {kg: true, proximity: true, signature: true, phenotype: true, prior: true}

# L1 disease module. Both sources are licence-clean for a redistributed CC-BY-4.0 output:
# STRING is CC BY 4.0 (its attribution travels in module.json) and Reactome data is CC0.
# Every value here is written into results/l1_target/module.json beside the result, because
# a module boundary that is not recorded cannot be argued with.
l1:
  species: Homo sapiens
  taxon: 9606
  string_version: "12.0"
  string_score_min: 700    # STRING "high confidence" -- the graph the walk runs on
  seed_score_min: 900      # STRING "highest confidence", physical subnetwork -- complex proxy
  rwr_restart: 0.7         # higher keeps the module tighter around the seed set
  module_size: 200
  max_pathway_size: 200    # bigger pathways are too generic to define "upstream"
  # Second-disease (Scalability) run only. NEVER a way around gate G1: leave it null and
  # let causal_gene carry the finding a person signed off.
  gene: null
  # Which target set each endpoint makes primary for ranking. This mapping is a project
  # decision (gate G2, D4), not a property of the method, so it lives here and L1's code
  # stays disease-agnostic. An endpoint absent from this map leaves both sets in play.
  primary_set_by_endpoint:
    chemoprevention: downstream
    mitotic_fidelity: upstream
    symptomatic: both

# L2 channel settings. Channel B scores network proximity between a drug's targets and
# the L1 disease module, against a degree-matched null (Guney et al., 2016).
l2:
  channel_b:
    open_targets_release: "26.06"   # drug-target release; restricted, never redistributed
    approved_only: true              # scope is repurposing of APPROVED drugs
    permutations: 1000               # null resamples; fewer destabilises the tail
    min_bin_size: 100                # degree-bin floor, so a hub is never resampled as itself
  # Phenotype channel (decision D10). The subject's terms are read from data_dir at run
  # time and never written here. Resources are downloaded whole and matched locally.
  channel_d:
    document_glob: "*Phenotype*.docx"
    hpo_url: http://purl.obolibrary.org/obo/hp/releases/2026-09-01/hp.obo
    monarch_url: https://data.monarchinitiative.org/monarch-kg/2026-09-02/tsv/disease_associations/disease_phenotype.all.tsv.gz
    open_targets_release: "26.06"   # indications; restricted, never redistributed (D7)
    approved_only: true                # the drug itself must be approved
    indication_stage: APPROVAL       # and approved FOR that indication; lower to widen
    permutations: 1000               # random queries per run; min attainable p = 1/1001
    p_max: 0.001                     # diseases no random query matched or beat
    top_diseases: 50                 # cap on diseases feeding the disease route
    min_term_ratio: 0.5              # phenotype route: IC(MICA)/IC(term) floor
