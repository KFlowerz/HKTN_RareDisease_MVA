name: mva-track2

# `nodefaults` removes Anaconda's `defaults` channels (repo.anaconda.com/pkgs/*), which
# conda otherwise merges in from base config. Two reasons, both deliberate:
#   1. Nothing here comes from them -- pysam and bcftools are bioconda, the rest
#      conda-forge -- so they add a resolver surface the project does not use.
#   2. They carry Anaconda's Terms of Service, which conda now blocks on until accepted.
#      A judge rebuilding this environment should not hit a licensing prompt to reproduce
#      a CC-BY-4.0 result. conda-forge and bioconda are community channels with no such
#      condition.
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - python=3.11
  - pandas
  - numpy
  - scipy
  - networkx
  - scikit-learn
  - pyyaml
  - pyarrow        # reads the Parquet drug-target release L2 channel B joins on.
                   # That release is licence-restricted and never redistributed --
                   # see src/l4_validate/sources.md and src/l2_channels/enrichment.py.
  - pysam
  - bcftools
  - snpeff=5.4.0c   # L0's LOCAL variant annotator. Pinned: its databases are built per
                    # snpEff version. Brings its own openjdk. See the README for the
                    # database download and the flags every invocation must carry.
  - jupyterlab
  - pytest          # README quickstart runs `pytest -q`; declared so it is not implicit
  - pip
  - pip:
      - anthropic
      - huggingface_hub
